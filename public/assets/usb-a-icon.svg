  <rect x="9" y="9" width="46" height="16" rx="2" stroke="currentColor" stroke-width="2" opacity="0.85"/>
  <!-- Side screws/mounting notches -->
  <rect x="1.5" y="13" width="4" height="14" rx="1" fill="currentColor" opacity="0.3"/>
  <rect x="58.5" y="13" width="4" height="14" rx="1" fill="currentColor" opacity="0.3"/>
</svg>
