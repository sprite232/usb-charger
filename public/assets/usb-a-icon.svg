<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" fill="none">
  <!-- USB-A port front view: wide rectangle housing -->
  <rect x="1.5" y="1.5" width="61" height="37" rx="3.5" stroke="currentColor" stroke-width="2.5"/>
  <!-- Inner tongue (the black divider bar inside USB-A port) -->
